<!DOCTYPE html>
<html>
  <head>
    <title>checkout</title>
    <link rel="stylesheet" href="checkoutCssJs/checkout.css">
    <link rel="stylesheet" href="checkoutCssJs/checkoutHeader.css">
    <link rel="stylesheet" href="checkoutCssJs/generalCheckout.css">
  </head>
  <body>
    <div class="header">
      <div class="left-part">
        <img class="logo" src="logo-icons/logo.png">
      </div>
      <div class="mid-part">
        <div class="checkout-title">
          Checkout <span class="checkout-counter">(2 items)</span>
        </div>
      </div>
      <div class="right-part">
        <img class="lock-icon" src="logo-icons/checkout-lock-icon.png">
      </div>
    </div>
    <div class="review-payment-order-summary-container">
      <div class="review-order-title">
        Revisa tu pedido
      </div>
      <div class="payment-order-summary-container">
        <div class="products-summary">

        </div>
        <div class="order-summary">
          <span class="resumen-title">Resumen del pedido </span>
          <div class="items-container">
            <div>Artículos(2):</div>
            <div>$28.94</div>
          </div>
          <div class="shipping-handling-container">
            <div>Envío y manipulación</div>
            <div>$0.00</div>
          </div>
          <div class="total-before-tax-container">
            <div>Total antes de impuestos:</div>
            <div>$28.94</div>
          </div>
          <div class="estimated-tax-container">
            <div> Impuestos estimados (10%)</div>
            <div> $2.89</div>
          </div>
          <div class="order-total-container">
            <div>Total del pedido:</div>
            <div> $31.83</div>
          </div>
        <button class="realizar-pedido-boton"> Realice su pedido </button>
        </div>
      </div>
    </div>
    <script type="module" src="checkout.js"></script>
  </body>
</html>
